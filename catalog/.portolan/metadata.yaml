# .portolan/metadata.yaml: catalog root. Collections inherit the fields below
# unless their own metadata.yaml overrides them. Collection files are written
# by tools/meta.py from tools/products.py.

title: "Global Surface Water Explorer v1.5"
description: >-
  A mirror of the aggregated layers of the [Global Surface Water Explorer](https://global-surface-water.appspot.com/)
  v1.5 (1984 to 2024), produced by the European Commission Joint Research
  Centre (JRC) with Google. The layers map where and when surface water
  occurred on land from March 1984 to December 2024, from the Landsat
  archive at a 0.00025° (about 30 m) grid. The catalog holds six
  collections, one per layer: occurrence, occurrence change intensity,
  seasonality, recurrence, transitions, and maximum extent. Each collection
  has the 504 upstream 10° × 10° cloud-optimized GeoTIFF tiles, copied byte
  for byte, plus one global overview COG for maps of the whole world. Read
  [AGENTS.md](AGENTS.md) before you query.

