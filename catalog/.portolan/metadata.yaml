source_url: "https://global-surface-water.appspot.com/download"
processing_notes: >-
  The 3,024 tiles (six layers × 504 tiles) under
  `download2024/Aggregated/VER1-5/` of the public CloudFerro bucket that the
  [download page](https://global-surface-water.appspot.com/download) links
  for V1.5 were copied unchanged; the MD5 of every copy matches the hash the
  bucket lists. The occurrence folder holds each tile twice under two names
  (`occurrence_<tile>_v1_5_2024.tif` and `<tile>_p41_Occurrence.tif`); only
  the first name was copied. The tiles carry no NoData tag; the STAC
  metadata records 255 as nodata, the "No data" value in the Data Users
  Guide. The global overview COG of each layer is the only derived file: a
  mosaic of the tiles resampled to 0.004° (16 × coarser), with nodata 255
  set and a colour table built from the Data Users Guide colours, in which
  "not water" and nodata are transparent. Occurrence and recurrence are
  averaged; seasonality, change, and transitions take the most common value
  (mode); extent takes the maximum. Use the tiles for analysis, and the
  overviews only for display. The build scripts are in [the
  repository](https://github.com/portolan-mirrors/global-surface-water).
known_issues: >-
  The Data Users Guide lists two
  bands for occurrence change intensity (`change_abs` and `change_norm`);
  the downloadable tiles hold one band, which matches the `change_norm`
  value table. The guide states that seasonality covers only 2022 to 2024
  and that 2022 onward uses Landsat Collection 2, which "introduces a
  residual co-registration offset" of up to about one 30 m pixel in some
  path/rows. Monthly history, yearly history, and monthly recurrence are not
  in this mirror.
